<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>metoo. — Create your account</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(180deg, rgba(10,8,10,0.55), rgba(10,8,10,0.85)),
      url('login-bg.jpg') center/cover no-repeat fixed;
    position:relative;
    padding:40px 0;
  }
  .top-logo{
    position:absolute;top:28px;left:40px;
    display:flex;align-items:center;gap:10px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:#fff;
    text-decoration:none;
  }
  .top-logo .mark{width:26px;height:26px;border-radius:7px;background:#C0152B;}

  .signup-card{
    width:100%;max-width:440px;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(6px);
    border-radius:16px;
    padding:36px 34px 30px;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    opacity:0;transform:translateY(24px);
    animation:riseIn .6s ease forwards;
  }
  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}

  .signup-title{
    text-align:center;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:20px;letter-spacing:0.03em;
    color:#171412;margin-bottom:6px;
  }
  .signup-sub{text-align:center;font-size:12.5px;color:#6E6663;margin-bottom:22px;}

  .role-toggle{
    display:flex;border:1px solid #EDE6E2;border-radius:10px;padding:4px;margin-bottom:22px;
  }
  .role-toggle button{
    flex:1;border:none;background:transparent;padding:10px;border-radius:7px;
    font-size:13px;font-weight:600;color:#6E6663;cursor:pointer;transition:all .18s ease;
    font-family:'Inter',sans-serif;
  }
  .role-toggle button.active{background:#C0152B;color:#fff;}

  .field{
    display:flex;align-items:center;gap:12px;
    border-bottom:1px solid #EDE6E2;padding:13px 4px;
  }
  .field i{color:#A8A09C;font-size:15px;width:16px;}
  .field input{
    border:none;outline:none;flex:1;font-size:14.5px;
    font-family:'Inter',sans-serif;color:#171412;background:transparent;
  }
  .field input::placeholder{color:#9C918D;}
  .field-group{margin-bottom:20px;}

  .btn-signup{
    width:100%;border:none;padding:14px;border-radius:999px;
    font-size:13.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
    color:#fff;cursor:pointer;
    background:linear-gradient(90deg,#C0152B,#E63950);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn-signup:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(192,21,43,0.35);}
  .btn-signup:active{transform:translateY(0);}

  .login-note{text-align:center;font-size:12.5px;color:#6E6663;margin-top:20px;}
  .login-note a{color:#C0152B;font-weight:600;text-decoration:none;}
  .login-note a:hover{text-decoration:underline;}

  .error-msg{
    display:none;background:#FBEAEC;color:#7A0D1C;font-size:12.5px;
    padding:9px 12px;border-radius:8px;margin-bottom:16px;
  }
  .error-msg.show{display:block;}

  @media (max-width:480px){
    .signup-card{margin:0 20px;padding:30px 24px 26px;}
    .top-logo{left:20px;}
  }
</style>
</head>
<body>

<a class="top-logo" href="Seller.html"><div class="mark"></div>metoo.</a>

<form class="signup-card" id="signup-form">
  <p class="signup-title">Create your account</p>
  <p class="signup-sub">Join metoo. as a buyer or a brand</p>

  <div class="role-toggle" id="role-toggle">
    <button type="button" data-role="buyer" class="active">I'm a buyer</button>
    <button type="button" data-role="seller">I'm a brand</button>
  </div>

  <p class="error-msg" id="error-msg">Fill in all fields to continue.</p>

  <div class="field-group">
    <div class="field">
      <i class="fa-regular fa-user" aria-hidden="true"></i>
      <input type="text" id="fullname" placeholder="Full name" autocomplete="name">
    </div>
    <div class="field">
      <i class="fa-regular fa-envelope" aria-hidden="true"></i>
      <input type="email" id="email" placeholder="Email address" autocomplete="email">
    </div>
    <div class="field">
      <i class="fa-solid fa-lock" aria-hidden="true"></i>
      <input type="password" id="password" placeholder="Password" autocomplete="new-password">
    </div>
  </div>

  <button type="submit" class="btn-signup">Create account</button>


</form>

<script>
  const roleToggle = document.getElementById('role-toggle');
  let selectedRole = new URLSearchParams(window.location.search).get('role') === 'seller' ? 'seller' : 'buyer';

  function syncToggle(){
    roleToggle.querySelectorAll('button').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.role === selectedRole);
    });
  }
  syncToggle();

  roleToggle.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    selectedRole = btn.dataset.role;
    syncToggle();
  });

  document.getElementById('signup-form').addEventListener('submit', function(e){
    e.preventDefault();
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('error-msg');

    if(!fullname || !email || !password){
      errorMsg.classList.add('show');
      return;
    }
    errorMsg.classList.remove('show');
    window.location.href = 'Seller.html?role=' + selectedRole;
  });
</script>

</body>
</html>
